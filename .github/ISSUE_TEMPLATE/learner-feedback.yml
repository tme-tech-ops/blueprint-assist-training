      label: Questions I still have
      description: |
        Things you couldn't find the answer to during the training. 
        Note: All questions submitted here will be organized, processed, and responded to by our team.
      placeholder: "e.g. How do I use BPA with a private orchestrator behind a VPN?"
    validations:
