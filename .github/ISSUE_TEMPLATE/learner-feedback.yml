name: Learner Feedback
description: Share your experience with Blueprint Assist training — what worked, what didn't, and what you'd like to see improved.
title: "[Feedback] "
labels: ["feedback", "training"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to share your experience. Your feedback directly improves the training content and Blueprint Assist itself.

  - type: dropdown
    id: session-type
    attributes:
      label: Session Type
      description: How did you go through the training?
      options:
        - Self-paced (read through sections on my own)
        - Instructor-led (attended a live session)
        - Workshop (hands-on lab with guidance)
        - Mixed
    validations:
      required: true

  - type: textarea
    id: mixed-details
    attributes:
      label: Mixed Session Details
      description: If you selected Mixed, please specify which combination of the three session types you used.
      placeholder: "e.g. Started with self-paced reading, then attended instructor-led session for sections 5-8..."
    validations:
      required: false

  - type: input
    id: instructor-poc
    attributes:
      label: Instructor/POC Name
      description: If you attended an instructor-led session or workshop, who was your instructor or point of contact?
      placeholder: "e.g. John Smith, Jane Doe"
    validations:
      required: false

  - type: dropdown
    id: bpa-version
    attributes:
      label: Blueprint Assist Version
      description: Which version of dap-bpa were you running? (check with `dap-bpa --version`)
      options:
        - v0.29.3
        - v0.28.2
        - v0.28.1
        - v0.28.0
        - v0.27.0
        - v0.26.0
        - v0.25.0 or earlier
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Your Role
      options:
        - Customer
        - Partner / ISV
        - Dell employee — Sales / SE / Services
        - Dell employee — Engineering / TME
        - Other
    validations:
      required: true

  - type: input
    id: other-role
    attributes:
      label: Other Role Details
      description: If you selected Other, please specify your role.
      placeholder: "e.g. Consultant, System Administrator, etc."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Sections Completed and Ratings
        
        For each section you completed, please rate your experience from 1 (negative) to 5 (positive). Leave sections blank if you didn't complete them.

  - type: dropdown
    id: section-0-rating
    attributes:
      label: "Section 000 — Quick Start - Zero to Hero"
      description: Rate this section if you completed it (1=negative, 5=positive)
      options:
        - ""
        - "1 — Negative experience"
        - "2 — Below expectations"
        - "3 — Met expectations"
        - "4 — Above expectations"
        - "5 — Excellent experience"
    validations:
      required: false

